[package]
name = "lume-sub"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUIフレームワーク
eframe = "0.27" # 2026年時点の安定版
egui = "0.27"

# 非同期ランタイム・通信
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# 音声キャプチャ用（まずはScreenCaptureKit、ダメならcpalに切り替え可能）
screencapturekit = "11.1.0"
cpal = "0.15"

# 環境変数（.envファイル）の読み込み用
dotenvy = "0.15"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
