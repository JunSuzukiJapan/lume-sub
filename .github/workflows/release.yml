# LumeSub リリースワークフロー：Universal .dmg をビルド・署名・公証して Release に添付
#
# トリガー:
#   - `v*` タグの push（例: v0.1.0）→ GitHub Release を作成
#   - 手動実行（Actions タブ → Run workflow）→ Artifact として .dmg を保存
#
# 事前準備（リポジトリ Settings → Secrets and variables → Actions に登録）:
#   APPLE_CERT_P12_BASE64  Developer ID 証明書（.p12）の Base64
#                          書き出し例: キーチェーンアクセスで証明書を書き出し後、
#                          `base64 < cert.p12 | tr -d '\n' | pbcopy` でコピーして貼り付け
#   APPLE_CERT_PASSWORD    上記 .p12 のパスワード
#   APPLE_DEVELOPER_ID     署名 ID（例: "Developer ID Application: Your Name (TEAMID)"）
#   APPLE_ID               Apple ID（例: you@example.com）
#   APPLE_TEAM_ID          Team ID（10桁）
#   APPLE_APP_PASSWORD     App 用パスワード（xxxx-xxxx-xxxx-xxxx）
#
# 注意: 秘密情報はすべて Secrets 経由でのみ渡すこと。このファイルに直書きしない。
#
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: タグと Cargo.toml のバージョン一致を確認
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "error: タグ ($TAG_VERSION) と Cargo.toml ($CARGO_VERSION) が不一致です" >&2
            exit 1
          fi

      - name: Rust ツールチェーンを準備
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cargo キャッシュ
        uses: Swatinem/rust-cache@v2

      - name: Developer ID 証明書を keychain に導入
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Universal .dmg をビルド・署名・公証
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build-dmg.sh

      - name: .dmg を Artifact に保存
        uses: actions/upload-artifact@v4
        with:
          name: LumeSub-universal-dmg
          path: dist/*.dmg

      - name: GitHub Release を作成
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
